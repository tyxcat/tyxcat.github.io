    "en": {"about":{"title":"Cady Tianyu Xu","subtitle":"\u003ca href=\"https://deepmind.google.com/\"\u003eGoogle DeepMind\u003c/a\u003e · LLM Agents · Multimodal AI","bio":"Hello! 👋 I'm Cady, a researcher at Google DeepMind. 🌀 My work focuses on multimodal LLM agents that move beyond open-ended generation toward closed-loop execution, bridging the gap between high-level reasoning and autonomous task completion in real-world environments.\n","bio_2":"Previously, I was a machine learning engineer on the Google XR team, where I developed perception models and multimodal LLMs for immersive, context-aware interaction. 🕶️ My recent work also spans multimodal human-centered systems and interactive AI, with publications at UIST and CHI.\n","bio_3":"Prior to my roles at Google, I was a Software Engineer at Apple. I received my Bachelor's degree in both Computer Science and Political Science from UC Berkeley. 🐻\n","bio_4":"I'm always excited to connect with researchers and practitioners working on LLMs, XR, or autonomous agents. Reach out via \u003ca href=\"https://www.linkedin.com/in/cadyxu/\"\u003eLinkedIn\u003c/a\u003e or \u003ca href=\"mailto:cadyxu@google.com\"\u003eemail\u003c/a\u003e, or check out my \u003ca href=\"https://scholar.google.com/citations?hl=en\u0026user=nx1V8M4AAAAJ\"\u003eGoogle Scholar\u003c/a\u003e for potential collaborations! 🐑\n"},"sections":{"news":"news","latest_posts":"latest posts","selected_publications":"selected publications"},"nav":{"about":"about","brand":"Cady Tianyu Xu","publications":"publications","news":"news"},"news":{"announcement_1":"2 papers accepted to \u003ca href=\"https://uist.acm.org/2025/\"\u003eUIST 2025\u003c/a\u003e! 🎉🎉","announcement_2":"Serving as a reviewer for \u003ca href=\"https://chi2026.acm.org/\"\u003eCHI 2026\u003c/a\u003e! 🤠","announcement_3":"Joined \u003ca href=\"https://deepmind.google/\"\u003eGoogle DeepMind\u003c/a\u003e! 🌀🌀🌀","announcement_4":"Project MoXaRt has been conditionally accepted to \u003ca hre
